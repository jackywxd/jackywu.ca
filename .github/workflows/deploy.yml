name: Deploy

on:
  push:
    branches: [main]
  # 不用空提交就能從 Actions 頁重跑，例如換了 Cloudflare token 之後
  workflow_dispatch:

# 部署不在半途取消：上傳一半的資產比被取代的舊版更糟，下一次部署反正會覆蓋它
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build

      # 上面已經建置過，這裡直接部署，不再跑第二次 build。
      # 用 lockfile 鎖住的 wrangler，跟本機 `pnpm exec wrangler deploy` 同一版。
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 上線後 smoke：對 https://jackywu.ca ──
      # 先確認線上換成了這一版（比對內容雜湊過的資產檔名），再跑 @smoke 旅程與只有線上才有的檢查
      # （www → apex、R2 影片可分段取得）。只讀不寫：這個站沒有帳號也沒有資料可以弄髒。
      # 失敗不會自動回滾 —— 回滾是判斷，要人做：pnpm exec wrangler rollback
      - name: Smoke（線上）
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec playwright test --project=prod

      - name: 失敗時保留 smoke trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 14
