name: Admin CI

# 後台（admin/）與共用規則（packages/）的型別檢查、單元與整合測試。
# 整合測試在 miniflare 的暫存目錄裡從空 D1 開始，不連任何線上資源。
on:
  pull_request:
    paths: ['admin/**', 'packages/**', '.github/workflows/admin-ci.yml']
  push:
    branches: [main]
    paths: ['admin/**', 'packages/**']
  workflow_dispatch:

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: admin/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 依賴一致性
        run: pnpm verify:deps
      - run: pnpm typecheck
      - run: pnpm test
