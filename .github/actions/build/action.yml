name: Build the site
description: >
  安裝、型別檢查、建置（含 postbuild 五個驗證）、產物斷言、E2E。
  PR 檢查與正式部署共用這一份，所以 CI 驗過的就是實際上線的。

runs:
  using: composite
  steps:
    # 版本取自 package.json 的 packageManager，不在這裡另寫一份
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # astro check 需要 TypeScript 6.x 的程式化 API；7.x（原生編譯器）還沒有，
    # 升上去會讓這一步直接崩潰，而不是回報型別錯誤。見 docs/gotchas.md。
    - name: Type check
      shell: bash
      run: pnpm check

    # 原始字型約 30MB，不進 git。快取避免每次重抓。
    - uses: actions/cache@v6
      with:
        path: src/assets/fonts/source
        key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}

    # prebuild 取字型 + 子集化；postbuild 跑五個驗證，任一不過就失敗
    - name: Build
      shell: bash
      run: pnpm build

    - name: 產物斷言
      shell: bash
      run: |
        set -e
        test -f dist/index.html
        test -f dist/404.html
        test -f dist/_redirects
        test -f dist/_headers
        ls dist/_astro/*.woff2 >/dev/null
        # 單檔 25 MiB 上限
        [ -z "$(find dist -type f -size +24M)" ] || { echo "::error::有檔案超過 25 MiB"; exit 1; }
        # 檔案數上限
        N=$(find dist -type f | wc -l)
        [ "$N" -lt 19000 ] || { echo "::error::檔案數 $N 逼近 20,000 上限"; exit 1; }
        # 中文字型預算
        KB=$(du -ck dist/_astro/*.woff2 | tail -1 | cut -f1)
        echo "CJK 字型合計 ${KB}KB"
        [ "$KB" -lt 1200 ] || { echo "::error::中文字型 ${KB}KB 超過 1.2MB 預算"; exit 1; }
        # _redirects 每行必須是三欄
        BAD=$(awk '!/^#/ && NF && NF!=3' dist/_redirects | wc -l)
        [ "$BAD" -eq 0 ] || { echo "::error::_redirects 有 $BAD 行欄數不對"; exit 1; }

    # ── E2E：訪客真的會做的事，對建好的 dist/ 跑 ──
    # 伺服器是 wrangler dev，與線上同一套資產處理（_headers 的 CSP、_redirects、404-page）。
    # PR 檢查與部署都走這裡：E2E 不過就不部署。
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Chromium
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: E2E
      shell: bash
      env:
        WRANGLER_SEND_METRICS: 'false'
      run: pnpm exec playwright test --project=ci

    - name: 失敗時保留 trace
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-traces
        path: test-results/
        retention-days: 14
